name: Update Profile Stats

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update this repo's README with latest activity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update README with GitHub metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GH_TOKEN }}
          filename: metrics.svg
          config_timezone: Asia/Jakarta

          # Options
          user: muris11
          template: classic
          base: header, activity, community, repositories

          # Features
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_threshold: 0%

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

          plugin_repositories: yes
          plugin_repositories_forks: no

      - name: Get current year
        id: year
        run: echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

      - name: Generate 3D GitHub City
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GH_TOKEN }}
          filename: metrics-city.svg
          user: muris11
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: ${{ steps.year.outputs.year }}
          plugin_skyline_frames: 6
          plugin_skyline_quality: 0.5
          plugin_skyline_settings: |
            {
              "url": "https://honzaap.github.io/GithubCity?name=${login}&year=${year}",
              "ready": "[...document.querySelectorAll('.display-info span')].map(span => span.innerText).includes('${login}')",
              "wait": 4,
              "hide": ".github-corner, .footer-link, .buttons-options, .mobile-rotate, .display-info span:first-child"
            }
